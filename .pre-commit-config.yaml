ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: "monthly"
  autofix_commit_msg: "style: pre-commit fixes"
  autofix_prs: false
default_stages: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
    - id: ruff
      args: ["--fix", "--show-fixes"]
    - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["-L", "fo,ihs,kake,te", "-S", "fixture"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    - id: check-yaml
    - id: trailing-whitespace
  # NOTE: the type checkers are deliberately not pre-commit hooks. Type checking
  # runs via `just typecheck` (the `types` dependency group, installed from uv.lock),
  # which is also what the `typecheck` CI job runs. Keeping a single entry point means the
  # type checker version and the dependencies being checked against cannot drift from what
  # the tests actually use.
  - repo: https://github.com/scientific-python/cookie
    rev: 2025.01.22
    hooks:
      - id: sp-repo-review
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
  - repo: local
    hooks:
      # pyrefly does not check the codes of a `# type: ignore[...]`, nor report
      # one that is no longer needed; a `# pyrefly: ignore[<kind>]` is checked
      # by the `unused-ignore` error in pyproject.toml
      - id: no-type-ignore
        name: "use `# pyrefly: ignore[<kind>]`, not `# type: ignore`"
        language: pygrep
        entry: '#\s*type:\s*ignore'
        types: [python]
  - repo: https://github.com/numpy/numpydoc
    rev: v1.8.0
    hooks:
      - id: numpydoc-validation
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.2
    hooks:
      - id: zizmor
