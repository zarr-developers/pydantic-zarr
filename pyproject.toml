[build-system]
requires = ["hatchling>=1.28.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pydantic-zarr"
dynamic = ["version"]
description = 'Pydantic models for the Zarr file format'
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
keywords = ["zarr", "pydantic"]
authors = [{ name = "Davis Bennett", email = "davis.v.bennett@gmail.com" }]
maintainers = [{ name = "David Stansby" }]


classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    # >= 2.12 for the MISSING sentinel (experimental there, stable in 2.14;
    # pydantic_zarr.core imports whichever spelling exists). The floor stays
    # below 2.13 so pydantic-zarr remains co-installable with downstreams
    # that cap pydantic (ome-zarr-models, and through it ome-zarr-py).
    "pydantic>=2.12",
    "numpy>=2.0.0",
    "packaging>=21.0",
    "zarr-metadata>=0.9.0",
    "typing-extensions>=4.6",
]

[project.urls]
Documentation = "https://pydantic-zarr.readthedocs.io/"
Changelog = "https://pydantic-zarr.readthedocs.io/en/latest/release-notes/"
Issues = "https://github.com/zarr-developers/pydantic-zarr/issues"
Source = "https://github.com/zarr-developers/pydantic-zarr"

[project.optional-dependencies]
zarr = ["zarr>=3.0.0"]

[dependency-groups]
test-base = [
    "coverage",
    "hypothesis>=6.100",
    # the testing extra holds zarr-metadata's own strategies, which draw the
    # documents the property tests check the readers against
    # (tests/test_pydantic_zarr/test_zarr_metadata_strategies.py); the floor
    # is the runtime floor
    "zarr-metadata[testing]>=0.9",
    "pytest==9.1.0",
    "pytest-cov",
    "pytest-examples",
    "xarray>=2025.10.0",
    "dask>=2025.11.0",
]
test = [
    {include-group = "test-base"},
    "pydantic-zarr[zarr]",
]
docs = [
    {include-group = "test-base"},
    "mkdocs-material",
    "mkdocstrings[python]",
    "pytest-examples",
    # docs pages embed pydantic error URLs (errors.pydantic.dev/<version>/...)
    # in print-checked output, so the docs build pins the minor version; it
    # cannot move past 2.12 while ome-zarr (via ome-zarr-models) caps pydantic
    "pydantic==2.12.*",
    "zarr>=3.1.0",
    "towncrier",
    # reference implementations the example scripts compare their output
    # against (xarray comes from the test-base group)
    "ome-zarr>=0.21",
    "ngff-zarr>=0.50",
]
dev = [
    {include-group = "test"},
]
# three checkers on purpose, each covering the others' blind spots: pyrefly
# (the project checker) is variance-lenient, so an invariant TypeVar bound
# refusing narrowed downstream parameterizations (#190) was invisible to it
# (and to mypy, which does not apply PEP 696 defaults inside lazy `type`
# aliases), and it let an unsound `GroupSpec.replace` override hide behind a
# suppression comment. ty and pyright both catch those classes of bug; each
# checks the library (every module but `experimental`, which is not held to
# this bar yet) and the downstream-shaped tests/typing_conformance.py,
# pyright because it is what pyright-checked downstreams run.
types = [
    {include-group = "test"},
    "pyrefly==1.4.0",
    "ty==0.0.93",
    "pyright==1.1.414",
]

[tool.uv]
# Every check runs on uv.lock (`uv run --locked`, see the justfile), so CI
# and a development machine install the same versions. The docs group pins
# pydantic below what the tests should run on (see its comment), so it is
# resolved apart from the groups that install the tests: the lockfile holds
# one resolution for `docs` and another for `test`, `types` and `dev`.
conflicts = [
    [{ group = "docs" }, { group = "test" }],
    [{ group = "docs" }, { group = "types" }],
    [{ group = "docs" }, { group = "dev" }],
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/pydantic_zarr/_version.py"

# tests/typing_conformance.py marks the calls it expects a checker to refuse
# with that checker's suppression comment, so an unused one (a refusal that
# stopped being reported) fails the check; pyright's counterpart is a
# file-level comment in that file
[[tool.ty.overrides]]
include = ["tests/typing_conformance.py"]

[tool.ty.overrides.rules]
unused-ignore-comment = "error"

[tool.coverage.run]
source_pkgs = ["pydantic_zarr", "tests"]
branch = true
parallel = true
omit = ["src/pydantic_zarr/__about__.py"]

[tool.coverage.paths]
pydantic_zarr = ["src/pydantic_zarr", "*/pydantic-zarr/src/pydantic_zarr"]
tests = ["tests", "*/pydantic-zarr/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
force-exclude = true
extend-exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "venv",
    "docs",
]

[tool.ruff.lint]
extend-select = [
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "EXE",  # flake8-executable
    "C4",   # flake8-comprehensions
    "FA",   # flake8-future-annotations
    "FLY",  # flynt
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "PERF", # Perflint
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks
    "PT",   # flake8-pytest-style
    "PYI",  # flake8-pyi
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",
    "SIM",  # flake8-simplify
    "SLOT", # flake8-slots
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "ANN401",
    "PT011",  # TODO: apply this rule
    "PT012",  # TODO: apply this rule
    "RET505",
    "RET506",
    "RUF005",
    "SIM108",
    "TRY003",
    "UP038",  # https://github.com/astral-sh/ruff/issues/7871
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "UP007"
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "RUF029", "SIM117", "SIM300"]
# example scripts assert on refused ValidationErrors by design (they are not
# pytest tests), and their literate sections import the reference libraries
# where the rendered docs section uses them
"examples/**" = ["PT017", "E402"]

[tool.pyrefly]
project-includes = ["src", "tests", "examples"]
search-path = ["src", "tests", "examples"]
# the reference implementations the example scripts import are docs-only
# dependencies; the `types` group does not install them
replace-imports-with-any = ["ome_zarr.*", "ngff_zarr", "ome_zarr"]
python-version = "3.12"

[tool.pyrefly.errors]
# TODO: enable each of these and fix any errors. They are the pyrefly counterparts
# of the mypy settings this project ran with before switching
# (disallow_any_generics = false, warn_return_any = false).
implicit-any-type-argument = false
implicit-any-lambda = false
no-any-return-explicit = false
no-any-return-implicit = false
# a `# pyrefly: ignore[<kind>]` that no longer suppresses an error of its kind
# fails the check; suppressions are written in that form, not as
# `# type: ignore[...]`, whose bracketed codes pyrefly does not check
unused-ignore = true

[tool.pyright]
# pyright's default excludes, plus the module the typecheck job does not hold
# to zero errors yet (see the `types` group)
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "src/pydantic_zarr/experimental"]

[tool.pytest.ini_options]
minversion = "7"
xfail_strict = true
testpaths = ["tests"]
log_cli_level = "INFO"
addopts = ["--durations=10", "-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
    # https://github.com/zarr-developers/zarr-python/issues/2948
    "ignore:The `order` keyword argument has no effect for Zarr format 3 arrays:RuntimeWarning",
    # Because AsyncArray.config is only present in zarr >= 3.1.0, ignore the warning until our
    # zarr min version is 3.1.0
    "ignore:Use AsyncArray.config instead",
    # numpy 2.5 deprecates unit-less np.datetime64("NaT") / np.timedelta64("NaT"), which zarr-python
    # and xarray still call internally. Remove once those libraries no longer trigger the warning.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    # the experimental module warns once, when first imported; its own tests
    # still exercise it until it is removed in 0.13 (test_deprecated_import
    # checks the warning itself)
    "ignore:`pydantic_zarr.experimental` is deprecated:DeprecationWarning",
]

[tool.repo-review]
ignore = [
    "MY100",  # type checking uses pyrefly, ty and pyright, not mypy
    "PC111",  # black formatting for docs, not sure if want,
    "PC140",  # type checking runs via `just typecheck` (the `types` group) and the typecheck CI job, not pre-commit
    "PC180",  # markdown formatter, no thanks
    "PY007",  # the task runner is `just` (the justfile), which repo-review does not detect
    "RTD100", # read the docs, no thanks,
    "RTD101", # read the docs, no thanks
    "RTD102", # read the docs, no thanks,
    "RTD103", # read the docs, no thanks
]

[tool.numpydoc_validation]
# See https://numpydoc.readthedocs.io/en/latest/validation.html#built-in-validation-checks for list of checks
checks = [
    "GL06",
    "GL07",
    # Currently broken; see https://github.com/numpy/numpydoc/issues/573
    # "GL09",
    "GL10",
    "SS02",
    "SS04",
    "PR02",
    "PR03",
    "PR05",
    "PR06",
]

[tool.towncrier]
directory = 'changes'
name = "pydantic-zarr"
package = 'pydantic_zarr'
package_dir = 'src'
filename = "docs/release-notes.md"
title_format = "## {name} {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/zarr-developers/pydantic-zarr/issues/{issue})"
start_string = "<!-- towncrier release notes start -->\n"
