name: Check pull request title

on:
  pull_request:
    # `edited` reruns the check when the title is changed
    types: [opened, edited, reopened, synchronize]

permissions: {}

# only the latest title matters
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-title:
    name: Check the title follows Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the repository for the justfile and ci/ script

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: just pr-title-check
