# Pull request checks run on uv.lock, so a new release of a dependency cannot
# fail an unrelated pull request. This workflow tests the newest versions
# pyproject.toml allows instead, weekly and on demand, so that a release that
# breaks pydantic-zarr shows up here before Dependabot's lockfile bump
# brings it into the pull request checks.

name: Latest dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  latest:
    name: py=${{ matrix.python-version }}, newest dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # required for hatch-vcs version discovery
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - name: Type check and test on the newest dependencies
      env:
        PY: ${{ matrix.python-version }}
      run: just py="$PY" test-latest
